- pergunta: Quanto custa o evento?
  resposta: "Nada, é tudo gratuito graças as empresas maravilhosas que estão nos patrocinando!"
- pergunta: Para quem é o evento?
  resposta: "Mulheres, homens trans e pessoas não-binárias de qualquer idade que tenham um conhecimento básico em lidar com computadores. Já tivemos participantes de todas as idades."
- pergunta: Como faço para participar?
  resposta: "Fique de olho nas nossas redes sociais e no site: assim que abrirmos inscrições para uma nova edição, publicamos por lá."
- pergunta: Preciso levar alguma coisa?
  resposta: "Sim! Por favor, traga seu notebook. Se você não puder, entre em contato conosco que damos um jeitinho (:"
- pergunta: Homem cis pode participar?
  resposta: "A prioridade será dada a mulheres, homens trans e pessoas não-binárias. Caso sobrem vagas, abriremos para homens cis também."
- pergunta: Como foi o evento passado?
  resposta: "Foi M A R A V I L H O S O! Dá uma olhadinha nas fotos lá no nosso Instagram."
- pergunta: Eu sei programar! Como posso ajudar?
  resposta: "Sempre precisamos de tutoras e tutores para ajudar as pessoas participantes a aprender a programar! Confira as informações do próximo evento nas nossas redes sociais."
- pergunta: Quero patrocinar o evento. O que faço?
  resposta: "Entre em contato conosco através de contato@railsgirls.com.br."
- pergunta: Posso ajudar de mais alguma maneira?
  resposta: "SIM! Você pode compartilhar com a galera para nos ajudar a espalhar a palavra do Rails Girls por aí e quem sabe até encontrar novos patrocinadores."
- pergunta: O evento tem código de conduta?
  resposta: "Sim! Todas as pessoas envolvidas no Rails Girls São Paulo seguem o nosso <a href=\"/codigo-de-conduta/\">Código de Conduta</a>. Se algo te deixar desconfortável, fale com a organização ou escreva para conduta@railsgirls.com.br."
